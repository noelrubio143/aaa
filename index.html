<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Trial Panel</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mut:#6e6e73;--ac:#f59e0b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d24;--tx:#f2f2f2;--mut:#9a9aa3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:24px 16px}
.card{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:400px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--mut);font-size:14px;margin:0 0 16px}
input,button{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid #8884;background:transparent;color:inherit;font-size:16px}
button{background:var(--ac);border:0;color:#000;font-weight:600}
</style></head><body><div class="card">
<h1>Free Trial Panel</h1>
<p>Gumawa ng free trial account (SSH, OVPN, Xray). 3 days ang bawat account.</p>
<!-- Optional: ilagay dito ang domain ng VPS mo para isang tap na lang -->
<input id="h" placeholder="VPS domain (hal. sg1.example.com)" autocomplete="off">
<button id="go">Open Panel</button>
<p id="m" style="margin:0"></p>
</div>
<script>
const DEFAULT_HOST = "";   // <- ilagay ang domain ng VPS mo dito kung gusto mong naka-set na
const PORT = 8090;
const q = new URLSearchParams(location.search).get("h");
let host = (q || DEFAULT_HOST || "").trim();
try { if (!host) host = localStorage.getItem("vps") || ""; } catch(e){}
const clean = v => v.trim().replace(/^https?:\/\//,"").replace(/[\/:].*$/,"");
function open_(h){
  h = clean(h);
  if(!/^[a-zA-Z0-9.-]+$/.test(h)){ document.getElementById("m").textContent="Invalid domain"; return; }
  try { localStorage.setItem("vps", h); } catch(e){}
  location.href = "http://" + h + ":" + PORT + "/";
}
document.getElementById("h").value = host;
document.getElementById("go").onclick = () => open_(document.getElementById("h").value);
if (host && (q || DEFAULT_HOST)) open_(host);   // auto-open kapag naka-set na ang host
</script></body></html>

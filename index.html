<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Trial Panel</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mut:#6e6e73;--ac:#f59e0b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d24;--tx:#f2f2f2;--mut:#9a9aa3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:24px 16px}
.card{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:400px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--mut);font-size:14px;margin:0 0 16px}
input,button{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid #8884;background:transparent;color:inherit;font-size:16px}
button{background:var(--ac);border:0;color:#000;font-weight:600;text-align:left}
button.alt{background:transparent;border:1px solid #8884;color:inherit;text-align:center;font-weight:500}
small{color:var(--mut);font-weight:400;float:right}
.row{display:flex;gap:6px}.row button{margin-bottom:10px}.row button.alt{width:auto;padding:12px 14px}
</style></head><body><div class="card">
<h1>Free Trial Panel</h1>
<p>Pumili ng server para gumawa ng free trial account (SSH, OVPN, Xray). 3 days ang bawat account.</p>
<div id="list"></div>
<input id="h" placeholder="Iba pang server: IP o domain" autocomplete="off">
<input id="n" placeholder="Pangalan (optional, hal. SG 1)" autocomplete="off">
<button id="go" class="alt">Open Panel</button>
<button id="sv" class="alt">Save server (sa device na ito)</button>
<p id="m" style="margin:8px 0 0"></p>
</div>
<script>
const PORT = 8090;
const $ = id => document.getElementById(id);
const clean = v => v.trim().replace(/^https?:\/\//,"").replace(/[\/:].*$/,"");
function open_(h){
  h = clean(h);
  if(!/^[a-zA-Z0-9.-]+$/.test(h)){ $("m").textContent="Invalid IP/domain"; return; }
  location.href = "http://" + h + ":" + PORT + "/";
}
$("go").onclick = () => open_($("h").value);
const q = new URLSearchParams(location.search).get("h");
if (q) open_(q);   // ?h=IP  -> diretso sa panel
let shared = [];
const getLocal = () => { try { return JSON.parse(localStorage.getItem("servers") || "[]"); } catch(e) { return []; } };
const setLocal = l => { try { localStorage.setItem("servers", JSON.stringify(l)); } catch(e) { $("m").textContent = "Hindi ma-save sa browser na ito"; } };
function render(){
  const box = $("list"); box.textContent = "";
  const seen = new Set();
  const add = (s, mine) => {
    if (!s || !s.host || seen.has(s.host)) return; seen.add(s.host);
    const row = document.createElement("div"); row.className = "row";
    const b = document.createElement("button"); b.style.flex = "1";
    b.textContent = s.name || s.host;
    const sm = document.createElement("small"); sm.textContent = s.host; b.append(sm);
    b.onclick = () => open_(s.host); row.append(b);
    if (mine) {
      const c = document.createElement("button"); c.className = "alt"; c.textContent = "Copy line"; c.title = "Para sa servers.json sa GitHub";
      c.onclick = () => { navigator.clipboard.writeText(JSON.stringify({name: s.name || s.host, host: s.host})); $("m").textContent = "Na-copy. Idagdag sa servers.json sa GitHub para makita ng lahat."; };
      const x = document.createElement("button"); x.className = "alt"; x.textContent = "×";
      x.onclick = () => { setLocal(getLocal().filter(v => v.host !== s.host)); render(); };
      row.append(c, x);
    }
    box.append(row);
  };
  shared.forEach(s => add(s, false));
  getLocal().forEach(s => add(s, true));
}
$("sv").onclick = () => {
  const h = clean($("h").value);
  if (!/^[a-zA-Z0-9.-]+$/.test(h)) { $("m").textContent = "Invalid IP/domain"; return; }
  const l = getLocal().filter(v => v.host !== h);
  l.push({name: $("n").value.trim() || h, host: h}); setLocal(l);
  $("h").value = ""; $("n").value = ""; $("m").textContent = "Na-save sa device na ito."; render();
};
// Shared list (servers.json sa repo) - makikita ng lahat ng bisita
fetch("servers.json", {cache:"no-store"}).then(r => r.json()).then(l => { shared = l; render(); }).catch(() => render());
</script></body></html>
